name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
        continue-on-error: true
      - run: dart analyze lib test integration_test test_driver
        continue-on-error: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # 测试当前不阻塞出包（开发优先、集中验证暂缓），结果仍会显示在运行详情里。
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: zhenguojian
            arguments: '--all-sources'
          - edition: zhenguojian-tv
            arguments: '--flavor tv --all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        id: signing
        run: |
          python scripts/configure_signing.py
          if [ -f android/key.properties ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置发布签名 Secrets，本次 APK 使用 debug 签名，仅供测试，不可用于正式分发。"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: 诊断签名 Secrets（证书指纹）
        run: |
          set -uo pipefail
          store="$RUNNER_TEMP/duanju-release.jks"
          if [ ! -f "$store" ]; then
            echo "未配置发布签名 Secrets，使用 debug 签名，跳过诊断。"
            exit 0
          fi
          echo "签名库: $store ($(stat -c%s "$store") 字节)"
          magic=$(od -An -tx1 -N4 "$store" | tr -d ' \n')
          case "$magic" in
            feedfeed) echo "格式: JKS" ;;
            3082*) echo "格式: PKCS#12" ;;
            *) echo "格式: 未知 (magic=$magic)，可能不是标准签名库" ;;
          esac
          trimmed="${ANDROID_KEYSTORE_PASSWORD#"${ANDROID_KEYSTORE_PASSWORD%%[![:space:]]*}"}"
          trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
          storepass="$ANDROID_KEYSTORE_PASSWORD"
          output=$("$JAVA_HOME/bin/keytool" -J-Duser.language=en -J-Duser.country=US \
            -list -v -keystore "$store" -storepass "$storepass" 2>&1) || true
          if printf '%s' "$output" | grep -qiE "password was incorrect|invalid|integrity"; then
            output2=$("$JAVA_HOME/bin/keytool" -J-Duser.language=en -J-Duser.country=US \
              -list -v -keystore "$store" -storepass "$trimmed" 2>&1) || true
            if ! printf '%s' "$output2" | grep -qiE "password was incorrect|invalid|integrity"; then
              echo "::warning::ANDROID_KEYSTORE_PASSWORD 首尾含空白字符（复制粘贴常见问题）。configure_signing.py 已自动去空白，本次不受影响；建议更新该 Secret 时去掉首尾换行/空格。"
              storepass="$trimmed"
              output="$output2"
            fi
          fi
          printf '%s' "$output" | grep -E "Alias name|SHA256:" || true
          if printf '%s' "$output" | grep -qiE "password was incorrect|invalid|integrity"; then
            echo "当前 Secret 密码无法打开签名库，尝试常见候选密码（仅在本库本地试探）…"
            cands=(
              "duanjuapp_release_password_2026" "zhenguoapp_release_password_2026"
              "zhenguo2026" "Zhenguo2026" "zhenguo2026!" "Zhenguo2026!"
              "zhenguotv2026" "ZhenguoTV2026" "ZhenguoTv2026" "zhenguo@2026"
              "duanju2026" "Duanju2026" "duanju2026!" "duanjuapp2026"
              "guoapp2026" "Guoapp2026" "android" "Android" "android2026"
              "123456" "password" "release" "release2026"
              "aa176aa6" "8a7dc6f2"
              "zhenguo" "Zhenguo" "zhenguotv" "ZhenguoTV" "ZhenguoTv"
              "hongguo" "Hongguo" "hongguo2026" "Hongguo2026"
              "2026" "tv2026" "app2026"
              "duanju_release" "zhenguo_release" "zhenguo_release_2026"
              "sign3" "sign" "keystore" "mykey"
              "serra006" "Serra006" "serra01" "Serra01"
              "zhenguo123456" "duanju123456" "zhenguo123" "duanju123"
            )
            found=""
            for pw in "${cands[@]}"; do
              out=$("$JAVA_HOME/bin/keytool" -J-Duser.language=en -J-Duser.country=US \
                -list -v -keystore "$store" -storepass "$pw" 2>&1) || true
              if ! printf '%s' "$out" | grep -qiE "password was incorrect|invalid|integrity"; then
                found="$pw"
                printf '%s' "$out" | grep -E "Alias name|SHA256:" || true
                echo "候选密码命中: [$found]"
                break
              fi
            done
            if [ -n "$found" ]; then
              echo "::error::签名库可用密码为 [$found]，但 ANDROID_KEYSTORE_PASSWORD Secret 的值不是它。请把该 Secret 更新为 [$found]，并核对 ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 后重跑。"
            else
              echo "::error::候选密码均未命中。请找到该 PKCS#12 签名库的源文件与密码，重设全部四个签名 Secrets；或换用一套全新签名库。"
            fi
            exit 1
          fi
          # keytool -list -v（英文 locale）的别名字段是 "Alias name: xxx" 行；
          # "Entry type: PrivateKeyEntry" 是条目类型行，不能拿它当别名。
          aliases=$(printf '%s' "$output" | grep -E "^Alias name:" | cut -d':' -f2- | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$aliases" ]; then
            echo "::error::签名库中没有私钥条目（PrivateKeyEntry），请确认上传的是签名用的 keystore 而非仅含证书的文件。"
            exit 1
          fi
          for alias in $aliases; do
            if "$JAVA_HOME/bin/keytool" -J-Duser.language=en -certreq -alias "$alias" \
                -keystore "$store" -storepass "$storepass" \
                -keypass "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1; then
              echo "别名 $alias: 库密码与密钥密码均校验通过"
            else
              echo "::error::别名 $alias 校验失败：库密码已通过，则 ANDROID_KEY_PASSWORD 不是该别名的密钥密码，或 ANDROID_KEY_ALIAS 与签名库中的别名不一致（当前 Secret 别名为: $ANDROID_KEY_ALIAS）。"
              exit 1
            fi
          done
          echo "签名 Secrets 自检通过（上方 SHA-256 应与仓库变量 ANDROID_CERT_SHA256 一致）。"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: 校验 APK 签名证书
        if: steps.signing.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ vars.ANDROID_CERT_SHA256 }}'
          if [ -z "$expected" ]; then
            echo "未设置仓库变量 ANDROID_CERT_SHA256，跳过证书指纹比对。" >&2
            exit 0
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)
          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi
          echo "apksigner：$apksigner"
          "$apksigner" --version || true
          for apk in dist/android/*.apk; do
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep -q "$expected"; then
              echo "签名证书与发布证书不一致，已终止。" >&2
              exit 1
            fi
          done
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
  windows:
    if: false
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4

  ios:
    if: false
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4

  release:
    needs: [android]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 发布 Release（电视端 / 手机端各自独立）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          phone_version=$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml | head -n1)
          tv_version=$(python3 -c "import json;print(json.load(open('versions.json'))['tv'])")
          cert_sha='${{ vars.ANDROID_CERT_SHA256 }}'
          if [ -n "$cert_sha" ]; then
            sign_note="已用固定发布证书签名，可覆盖安装升级，无需卸载。"
            sign_tail="签名证书 SHA-256：$cert_sha"
          else
            sign_note="未配置发布签名，当前为 debug 签名，仅供测试，不能覆盖正式版安装。"
            sign_tail="签名证书：未配置（当前为 debug 签名）"
          fi

          # 每个端只发布自己那几个 APK，互不混装：电视端与手机端版本线独立，
          # 这样电视端可以单独发 1.0.x，手机端继续 0.2.x。
          publish() {
            edition="$1"; version="$2"; tag="$3"; title="$4"; intro="$5"
            src="artifacts/$edition"
            out="release-$edition"
            rm -rf "$out"; mkdir -p "$out"
            cp "$src"/*.apk "$out"/
            ( cd "$out" && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )
            {
              printf '%s\n\n' "$intro"
              printf 'Android（%s）\n' "$sign_note"
              printf '%s\n' "- *-arm64-v8a.apk：绝大多数设备选这个"
              printf '%s\n' "- *-armeabi-v7a.apk：较老的 32 位设备"
              printf '%s\n' "- *-x86_64.apk：模拟器 / x86 设备"
              printf '\n%s\n' "校验：SHA256SUMS.txt"
              printf '%s\n' "$sign_tail"
            } > "$out/notes.md"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$out"/*.apk "$out"/SHA256SUMS.txt --clobber
              gh release edit "$tag" --title "$title" --notes-file "$out/notes.md"
              # 清掉本轮已不再产出的旧附件，避免下载到过期文件。
              for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
                case "$name" in
                  *.apk) [ -e "$out/$name" ] || gh release delete-asset "$tag" "$name" --yes ;;
                esac
              done
            else
              gh release create "$tag" "$out"/*.apk "$out"/SHA256SUMS.txt --title "$title" --notes-file "$out/notes.md"
            fi
          }

          publish zhenguojian-android "$phone_version" "app-v$phone_version" "真果鉴 ${phone_version}" \
            "手机 / 平板版 ${phone_version}（包名 com.duanju.zhenguojian，版本线独立于电视端）。功能与电视端同源，界面按触屏布局。"
          # 电视端后发，保证 Releases 页首条是电视版。
          publish zhenguojian-tv-android "$tv_version" "tv-v$tv_version" "真果TV ${tv_version}" \
            "电视端正式版 ${tv_version}（包名 com.duanju.zhenguo.tv，独立版本线）。遥控器全流程、10-foot 界面、内置 12 个站源。"
