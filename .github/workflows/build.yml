name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
        continue-on-error: true
      - run: dart analyze lib test integration_test test_driver
        continue-on-error: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # 测试当前不阻塞出包（开发优先、集中验证暂缓），结果仍会显示在运行详情里。
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: zhenguojian
            arguments: '--all-sources'
          - edition: zhenguojian-tv
            arguments: '--flavor tv --all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        id: signing
        run: |
          python scripts/configure_signing.py
          if [ -f android/key.properties ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置发布签名 Secrets，本次 APK 使用 debug 签名，仅供测试，不可用于正式分发。"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: 诊断签名 Secrets（证书指纹）
        run: |
          set -uo pipefail
          store="$RUNNER_TEMP/duanju-release.jks"
          if [ ! -f "$store" ]; then
            echo "未配置发布签名 Secrets，使用 debug 签名，跳过诊断。"
            exit 0
          fi
          echo "签名库: $store ($(stat -c%s "$store") 字节)"
          magic=$(od -An -tx1 -N4 "$store" | tr -d ' \n')
          case "$magic" in
            feedfeed) echo "格式: JKS" ;;
            3082*) echo "格式: PKCS#12" ;;
            *) echo "格式: 未知 (magic=$magic)，可能不是标准签名库" ;;
          esac
          trimmed="${ANDROID_KEYSTORE_PASSWORD#"${ANDROID_KEYSTORE_PASSWORD%%[![:space:]]*}"}"
          trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
          storepass="$ANDROID_KEYSTORE_PASSWORD"
          output=$("$JAVA_HOME/bin/keytool" -J-Duser.language=en -J-Duser.country=US \
            -list -v -keystore "$store" -storepass "$storepass" 2>&1) || true
          if printf '%s' "$output" | grep -qiE "password was incorrect|invalid|integrity"; then
            output2=$("$JAVA_HOME/bin/keytool" -J-Duser.language=en -J-Duser.country=US \
              -list -v -keystore "$store" -storepass "$trimmed" 2>&1) || true
            if ! printf '%s' "$output2" | grep -qiE "password was incorrect|invalid|integrity"; then
              echo "::error::ANDROID_KEYSTORE_PASSWORD 的首尾含空白字符（复制粘贴常见问题）。请删除该 Secret 重新粘贴（不要带换行/空格），或改用去空白后的值。"
              storepass="$trimmed"
              output="$output2"
            fi
          fi
          printf '%s' "$output" | grep -E "PrivateKeyEntry|SHA-256" || true
          if printf '%s' "$output" | grep -qiE "password was incorrect|invalid|integrity"; then
            echo "::error::签名 Secrets 校验失败：ANDROID_KEYSTORE_PASSWORD 无法打开 ANDROID_KEYSTORE_BASE64 中的签名库（两者不属于同一个 keystore，或密码不是该库的密码）。请确认密码后重设全部四个签名 Secrets。"
            exit 1
          fi
          aliases=$(printf '%s' "$output" | grep -E "PrivateKeyEntry" | cut -d',' -f1 | tr -d ' ')
          if [ -z "$aliases" ]; then
            echo "::error::签名库中没有私钥条目（PrivateKeyEntry），请确认上传的是签名用的 keystore 而非仅含证书的文件。"
            exit 1
          fi
          for alias in $aliases; do
            if "$JAVA_HOME/bin/keytool" -J-Duser.language=en -certreq -alias "$alias" \
                -keystore "$store" -storepass "$storepass" \
                -keypass "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1; then
              echo "别名 $alias: 库密码与密钥密码均校验通过"
            else
              echo "::error::别名 $alias 校验失败：库密码已通过，则 ANDROID_KEY_PASSWORD 不是该别名的密钥密码，或 ANDROID_KEY_ALIAS 与签名库中的别名不一致（当前 Secret 别名为: $ANDROID_KEY_ALIAS）。"
              exit 1
            fi
          done
          echo "签名 Secrets 自检通过（上方 SHA-256 应与仓库变量 ANDROID_CERT_SHA256 一致）。"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: 校验 APK 签名证书
        if: steps.signing.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ vars.ANDROID_CERT_SHA256 }}'
          if [ -z "$expected" ]; then
            echo "未设置仓库变量 ANDROID_CERT_SHA256，跳过证书指纹比对。" >&2
            exit 0
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)
          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi
          echo "apksigner：$apksigner"
          "$apksigner" --version || true
          for apk in dist/android/*.apk; do
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep -q "$expected"; then
              echo "签名证书与发布证书不一致，已终止。" >&2
              exit 1
            fi
          done
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
  windows:
    if: false
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4

  ios:
    if: false
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4

  release:
    needs: [android]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成发布文件清单
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          mkdir -p release
          for directory in artifacts/*/; do
            for file in "$directory"*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              if [ "$name" = "SHA256SUMS.txt" ]; then
                continue
              fi
              cp "$file" "release/$name"
            done
          done
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="app-v${version//+/-}"
          apk_note="Android（已用固定发布证书签名，可覆盖安装升级，无需卸载）："
          if printf '%s\n' "${{ vars.ANDROID_CERT_SHA256 }}" | grep -q .; then
            apk_note="Android（已用固定发布证书签名，可覆盖安装升级，无需卸载）："
          else
            apk_note="Android（未配置发布签名，当前为 debug 签名，仅供测试，不能覆盖正式版安装）："
          fi
          {
            printf '%s\n\n' "版本 ${version}。电视端只有「真果TV」一个应用，包含全部站源："
            printf '%s\n' "- 真果TV zhenguojian-tv：电视/盒子版，全部站源（独立包名 com.duanju.zhenguo.tv，仅电视桌面显示，遥控器操作，可与旧版红果鉴/真果鉴并存）"
            printf '%s\n' "- 真果鉴 zhenguojian：手机/平板版，全部站源"
            printf '\n%s\n' "$apk_note"
            printf '%s\n' "- *-arm64-v8a.apk：绝大多数手机选这个"
            printf '%s\n' "- *-armeabi-v7a.apk：较老的 32 位手机"
            printf '%s\n' "- *-x86_64.apk：模拟器"
            printf '\n%s\n' "iOS（未签名，需自行签名后才能安装）："
            printf '%s\n' "- *-ios-unsigned.ipa：未签名 IPA，用 AltStore / Sideloadly / TrollStore 等工具自签后安装"
            printf '%s\n' "- *-ios-unsigned-app.zip：未签名 Runner.app 压缩包，供自行签名 / 打包使用"
            printf '\n%s\n' "Windows（解压后运行 zhenguojian.exe）："
            printf '%s\n' "- *-windows-x64.zip：Windows 10/11 x64 完整包；构建机没有音频和图形设备，播放自检未通过，未做设备验收"
            printf '\n%s\n' "校验：SHA256SUMS.txt"
            if printf '%s\n' "${{ vars.ANDROID_CERT_SHA256 }}" | grep -q .; then
              printf '%s\n' "签名证书 SHA-256：${{ vars.ANDROID_CERT_SHA256 }}"
            else
              printf '%s\n' "签名证书：未配置（当前为 debug 签名）"
            fi
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --title "真果TV ${version}" --notes-file notes.md
            # 清理上一次构建留下、本轮已不再产出的附件，避免下载到过期文件。
            for name in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              if [ ! -e "release/$name" ]; then
                gh release delete-asset "$tag" "$name" --yes
              fi
            done
          else
            gh release create "$tag" release/* --title "真果TV ${version}" --notes-file notes.md
          fi
